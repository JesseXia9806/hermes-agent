# eHR系统自动审批Cron配置
# 作者: Jesse Xia
# 创建日期: 2026-08-04

# 每天上午8点执行
0 8 * * * /Users/jessexia/.hermes/scripts/ehr_cron_approve.sh

# 每天下午6点执行  
0 18 * * * /Users/jessexia/.hermes/scripts/ehr_cron_approve.sh

# 每周日生成汇总报告
0 7 * * 0 /Users/jessexia/.hermes/scripts/ehr_weekly_report.sh

# 任务说明:
# - 上午8点: 检查并审批前一天晚上到早上之间的单据
# - 下午6点: 检查并审批当天白天产生的单据  
# - 周日7点: 生成上周审批汇总报告

# 日志位置:
# - 日常审批日志: ~/.hermes/logs/ehr_cron_YYYYMMDD_HHMMSS.log
# - 汇总报告: ~/.hermes/logs/ehr_weekly_report_YYYYMMDD.txt

# 注意事项:
# 1. 确保凭据文件 ~/.hermes/secrets/ehr_sercomm.txt 存在且权限正确
# 2. 确保浏览器工具可用
# 3. 定期检查日志文件，确保任务正常运行
# 4. 如需修改执行时间，编辑本文件后运行 crontab -e